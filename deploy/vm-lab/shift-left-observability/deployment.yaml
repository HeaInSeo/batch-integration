apiVersion: apps/v1
kind: Deployment
metadata:
  name: shift-left-observability
  namespace: shift-left-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shift-left-observability
  template:
    metadata:
      labels:
        app: shift-left-observability
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site
          configMap:
            name: shift-left-observability-site
