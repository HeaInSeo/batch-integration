worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/shift-left-observability-tailnet-proxy/access.log;
    error_log  /var/log/shift-left-observability-tailnet-proxy/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 8008 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            proxy_pass http://10.113.24.96;
            proxy_http_version 1.1;
            proxy_set_header Host shift-left-observability.10.113.24.96.nip.io;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }
}
